<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支部画像 - 党员管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>党员管理系统</h1>
        <p>乡村振兴学院</p>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>首页看板</span>
        </a>
        <a href="members.html" class="nav-item">
          <i class="fas fa-users"></i>
          <span>党员管理</span>
        </a>
        <a href="portrait.html" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>党员画像</span>
        </a>
        <a href="stats.html" class="nav-item active">
          <i class="fas fa-chart-pie"></i>
          <span>支部画像</span>
        </a>
        <a href="partners.html" class="nav-item">
          <i class="fas fa-handshake"></i>
          <span>合作伙伴</span>
        </a>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">支部画像分析</h2>
      </div>

      <!-- 筛选条件 -->
      <div class="card mb-3">
        <div class="toolbar mb-0">
          <div class="filters">
            <div class="filter-item">
              <label>选择支部:</label>
              <select id="portraitBranch" onchange="updatePortrait()">
                <option value="">全部支部</option>
                <option value="现代农业系党支部">现代农业系党支部</option>
                <option value="社会化服务系党支部">社会化服务系党支部</option>
                <option value="新农人研培中心党支部">新农人研培中心党支部</option>
                <option value="学院办公室党支部">学院办公室党支部</option>
                <option value="学院党委">学院党委</option>
              </select>
            </div>
            <div class="filter-item">
              <label>党员类型:</label>
              <select id="portraitType" onchange="updatePortrait()">
                <option value="">全部</option>
                <option value="正式党员">正式党员</option>
                <option value="预备党员">预备党员</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 基础统计 -->
      <div class="stat-cards">
        <div class="stat-card">
          <div class="stat-icon red">
            <i class="fas fa-users"></i>
          </div>
          <div class="stat-info">
            <h3 id="portraitTotal">-</h3>
            <p>分析党员数</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <i class="fas fa-user-graduate"></i>
          </div>
          <div class="stat-info">
            <h3 id="portraitAvgAge">-</h3>
            <p>平均年龄</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">
            <i class="fas fa-calendar-check"></i>
          </div>
          <div class="stat-info">
            <h3 id="portraitAvgPartyAge">-</h3>
            <p>平均党龄</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">
            <i class="fas fa-trophy"></i>
          </div>
          <div class="stat-info">
            <h3 id="portraitTagged">-</h3>
            <p>标签党员</p>
          </div>
        </div>
      </div>

      <!-- 人口统计特征 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-chart-pie"></i> 人口统计特征</h3>
        </div>
        <div class="chart-grid">
          <div class="chart-container" style="height:280px;">
            <canvas id="portraitGenderChart"></canvas>
          </div>
          <div class="chart-container" style="height:280px;">
            <canvas id="portraitEducationChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 年龄和党龄分布 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-chart-bar"></i> 年龄与党龄分布</h3>
        </div>
        <div class="chart-grid">
          <div class="chart-container" style="height:300px;">
            <canvas id="portraitAgeChart"></canvas>
          </div>
          <div class="chart-container" style="height:300px;">
            <canvas id="portraitPartyAgeChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 组织分布 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-sitemap"></i> 组织分布</h3>
        </div>
        <div class="chart-grid">
          <div class="chart-container" style="height:300px;">
            <canvas id="portraitBranchChart"></canvas>
          </div>
          <div class="chart-container" style="height:300px;">
            <canvas id="portraitPositionChart"></canvas>
          </div>
        </div>
      </div>

      <!-- 综合画像雷达图 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-broadcast-tower"></i> 综合画像</h3>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          <div class="chart-container" style="height:350px;">
            <canvas id="portraitRadarChart"></canvas>
          </div>
          <div>
            <h4 style="margin-bottom:16px;">画像维度说明</h4>
            <div id="portraitDimensions">
              <!-- 动态填充 -->
            </div>
          </div>
        </div>
      </div>

      <!-- 标签分析 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-tags"></i> 标签分析</h3>
        </div>
        <div class="chart-grid">
          <div class="chart-container" style="height:300px;">
            <canvas id="portraitTagsChart"></canvas>
          </div>
          <div>
            <h4 class="mb-3">标签分布详情</h4>
            <div id="tagsDetail" style="max-height:280px;overflow-y:auto;">
              <!-- 动态填充 -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data-manager.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 全局图表实例
    let charts = {};

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
      App.init();
      updatePortrait();
    });

    // 更新画像数据
    function updatePortrait() {
      const branch = document.getElementById('portraitBranch').value;
      const type = document.getElementById('portraitType').value;

      // 获取筛选后的党员
      let members = DataManager.getAllMembers();
      if (branch) members = members.filter(m => m.branch === branch);
      if (type) members = members.filter(m => m.type === type);

      // 更新基础统计
      updateBasicStats(members);

      // 更新各维度图表
      updateGenderChart(members);
      updateEducationChart(members);
      updateAgeChart(members);
      updatePartyAgeChart(members);
      updateBranchChart(members);
      updatePositionChart(members);
      updateRadarChart(members);
      updateTagsAnalysis(members);
    }

    // 更新基础统计
    function updateBasicStats(members) {
      document.getElementById('portraitTotal').textContent = members.length;

      // 计算平均年龄
      const ages = members.map(m => App.calculateAge(m.birthDate)).filter(a => a);
      const avgAge = ages.length ? (ages.reduce((a, b) => a + b, 0) / ages.length).toFixed(1) : '-';
      document.getElementById('portraitAvgAge').textContent = avgAge;

      // 计算平均党龄
      const partyAges = members.map(m => App.calculatePartyAge(m.joinDate)).filter(a => a);
      const avgPartyAge = partyAges.length ? (partyAges.reduce((a, b) => a + b, 0) / partyAges.length).toFixed(1) : '-';
      document.getElementById('portraitAvgPartyAge').textContent = avgPartyAge;

      // 标签党员数
      const tagged = members.filter(m => m.tags && m.tags.length > 0).length;
      document.getElementById('portraitTagged').textContent = tagged;
    }

    // 性别分布图
    function updateGenderChart(members) {
      const male = members.filter(m => m.gender === '男').length;
      const female = members.filter(m => m.gender === '女').length;

      const data = {
        labels: ['男', '女'],
        values: [male, female]
      };

      const config = ChartConfig.getPieConfig(data, '性别分布');
      charts.gender = ChartConfig.createChart('portraitGenderChart', config);
    }

    // 学历分布图
    function updateEducationChart(members) {
      const education = {};
      members.forEach(m => {
        const edu = m.education || '未知';
        education[edu] = (education[edu] || 0) + 1;
      });

      const labels = Object.keys(education).sort();
      const values = labels.map(l => education[l]);

      const data = {
        labels: labels,
        values: values
      };

      const config = ChartConfig.getDoughnutConfig(data, '学历分布');
      charts.education = ChartConfig.createChart('portraitEducationChart', config);
    }

    // 年龄分布柱状图
    function updateAgeChart(members) {
      const ageDist = {
        '25岁以下': 0, '26-35岁': 0, '36-45岁': 0, '46-55岁': 0, '56岁以上': 0
      };

      members.forEach(m => {
        const age = App.calculateAge(m.birthDate);
        if (age) {
          if (age < 26) ageDist['25岁以下']++;
          else if (age <= 35) ageDist['26-35岁']++;
          else if (age <= 45) ageDist['36-45岁']++;
          else if (age <= 55) ageDist['46-55岁']++;
          else ageDist['56岁以上']++;
        }
      });

      const data = {
        labels: Object.keys(ageDist),
        values: Object.values(ageDist)
      };

      const config = ChartConfig.getBarConfig(data, '年龄分布');
      charts.age = ChartConfig.createChart('portraitAgeChart', config);
    }

    // 党龄分布
    function updatePartyAgeChart(members) {
      const partyAgeDist = {
        '1年以下': 0, '1-3年': 0, '3-5年': 0, '5-10年': 0, '10年以上': 0
      };

      members.forEach(m => {
        const partyAge = App.calculatePartyAge(m.joinDate);
        if (partyAge !== null) {
          if (partyAge < 1) partyAgeDist['1年以下']++;
          else if (partyAge <= 3) partyAgeDist['1-3年']++;
          else if (partyAge <= 5) partyAgeDist['3-5年']++;
          else if (partyAge <= 10) partyAgeDist['5-10年']++;
          else partyAgeDist['10年以上']++;
        }
      });

      const data = {
        labels: Object.keys(partyAgeDist),
        values: Object.values(partyAgeDist)
      };

      const config = ChartConfig.getBarConfig(data, '党龄分布');
      charts.partyAge = ChartConfig.createChart('portraitPartyAgeChart', config);
    }

    // 支部分布图
    function updateBranchChart(members) {
      const branches = {};
      members.forEach(m => {
        const branch = m.branch || '未知';
        branches[branch] = (branches[branch] || 0) + 1;
      });

      const labels = Object.keys(branches);
      const values = Object.values(branches);

      const data = { labels, values };
      const config = ChartConfig.getHorizontalBarConfig(data, '支部党员数量');
      charts.branch = ChartConfig.createChart('portraitBranchChart', config);
    }

    // 职务分布
    function updatePositionChart(members) {
      const positions = {};
      members.forEach(m => {
        const pos = m.partyPosition || '普通党员';
        positions[pos] = (positions[pos] || 0) + 1;
      });

      const labels = Object.keys(positions).sort((a, b) => positions[b] - positions[a]).slice(0, 8);
      const values = labels.map(l => positions[l]);

      const data = { labels, values };
      const config = ChartConfig.getHorizontalBarConfig(data, '党内职务分布');
      charts.position = ChartConfig.createChart('portraitPositionChart', config);
    }

    // 综合雷达图
    function updateRadarChart(members) {
      if (members.length === 0) return;

      // 计算各维度得分（归一化到0-100）
      const dimensions = {};

      // 1. 年龄活力 (年轻=高)
      const ages = members.map(m => App.calculateAge(m.birthDate)).filter(a => a);
      if (ages.length) {
        const avgAge = ages.reduce((a, b) => a + b, 0) / ages.length;
        dimensions['年龄活力'] = Math.max(0, Math.min(100, (60 - avgAge) * 3 + 50));
      } else {
        dimensions['年龄活力'] = 50;
      }

      // 2. 学历水平
      const eduScore = { '博士': 100, '硕士': 80, '本科': 60, '大专': 40, '其他': 20 };
      const scores = members.map(m => eduScore[m.education] || 30);
      dimensions['学历水平'] = scores.reduce((a, b) => a + b, 0) / scores.length;

      // 3. 党龄资历
      const partyAges = members.map(m => App.calculatePartyAge(m.joinDate)).filter(a => a !== null);
      if (partyAges.length) {
        const avgPartyAge = partyAges.reduce((a, b) => a + b, 0) / partyAges.length;
        dimensions['党龄资历'] = Math.min(100, avgPartyAge * 10);
      } else {
        dimensions['党龄资历'] = 30;
      }

      // 4. 组织参与度 (有职务=高)
      const withPosition = members.filter(m => m.partyPosition).length;
      dimensions['组织参与度'] = members.length ? (withPosition / members.length * 100) : 50;

      // 5. 标签丰富度
      const withTags = members.filter(m => m.tags && m.tags.length > 0).length;
      dimensions['标签丰富度'] = members.length ? (withTags / members.length * 100) : 50;

      // 6. 发展活跃度
      dimensions['发展活跃度'] = 70; // 默认值

      const labels = Object.keys(dimensions);
      const values = labels.map(l => Math.round(dimensions[l]));

      const data = { labels, values };
      const config = ChartConfig.getRadarConfig(data, '综合画像');
      charts.radar = ChartConfig.createChart('portraitRadarChart', config);

      // 更新维度说明
      const dimensionsContainer = document.getElementById('portraitDimensions');
      dimensionsContainer.innerHTML = labels.map(l => `
        <div class="d-flex align-center justify-between mb-2">
          <span>${l}</span>
          <span class="tag ${dimensions[l] >= 70 ? 'tag-green' : dimensions[l] >= 40 ? 'tag-yellow' : 'tag-red'}">
            ${Math.round(dimensions[l])}分
          </span>
        </div>
        <div style="background:#e9ecef;height:6px;border-radius:3px;margin-bottom:12px;">
          <div style="background:var(--primary-color);height:100%;border-radius:3px;width:${dimensions[l]}%;"></div>
        </div>
      `).join('');
    }

    // 标签分析
    function updateTagsAnalysis(members) {
      const tagCount = {};
      members.forEach(m => {
        if (m.tags && m.tags.length) {
          m.tags.forEach(tag => {
            tagCount[tag] = (tagCount[tag] || 0) + 1;
          });
        }
      });

      // 标签柱状图
      const sortedTags = Object.entries(tagCount).sort((a, b) => b[1] - a[1]).slice(0, 8);

      if (sortedTags.length) {
        const labels = sortedTags.map(t => t[0]);
        const values = sortedTags.map(t => t[1]);

        const data = { labels, values };
        const config = ChartConfig.getBarConfig(data, '标签统计');
        charts.tags = ChartConfig.createChart('portraitTagsChart', config);
      } else {
        const ctx = document.getElementById('portraitTagsChart');
        if (ctx) {
          ctx.parentElement.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-tags"></i>
              <p>暂无标签数据</p>
            </div>
          `;
        }
      }

      // 标签详情
      const tagsDetail = document.getElementById('tagsDetail');
      if (sortedTags.length) {
        tagsDetail.innerHTML = sortedTags.map(([tag, count]) => `
          <div class="d-flex align-center justify-between mb-2" style="padding:8px;background:#f8f9fa;border-radius:4px;">
            <span>${tag}</span>
            <span class="tag tag-red">${count}人</span>
          </div>
        `).join('');
      } else {
        tagsDetail.innerHTML = '<p class="text-muted">暂无标签数据</p>';
      }
    }
  </script>
</body>
</html>
