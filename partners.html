<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>合作伙伴管理 - 党员管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>党员管理系统</h1>
        <p>乡村振兴学院</p>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>首页看板</span>
        </a>
        <a href="members.html" class="nav-item">
          <i class="fas fa-users"></i>
          <span>党员管理</span>
        </a>
        <a href="portrait.html" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>党员画像</span>
        </a>
        <a href="stats.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>
          <span>支部画像</span>
        </a>
        <a href="partners.html" class="nav-item active">
          <i class="fas fa-handshake"></i>
          <span>合作伙伴</span>
        </a>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">党建合作伙伴管理</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="exportPartners()">
            <i class="fas fa-download"></i> 导出
          </button>
          <button class="btn btn-primary" onclick="openAddModal()">
            <i class="fas fa-plus"></i> 新增合作伙伴
          </button>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="stat-cards" id="partnerStats">
        <div class="stat-card">
          <div class="stat-icon red">
            <i class="fas fa-handshake"></i>
          </div>
          <div class="stat-info">
            <h3 id="partnerTotal">-</h3>
            <p>合作伙伴总数</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <i class="fas fa-check-circle"></i>
          </div>
          <div class="stat-info">
            <h3 id="partnerActive">-</h3>
            <p>合作中</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">
            <i class="fas fa-clock"></i>
          </div>
          <div class="stat-info">
            <h3 id="partnerNegotiating">-</h3>
            <p>洽谈中</p>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">
            <i class="fas fa-building"></i>
          </div>
          <div class="stat-info">
            <h3 id="partnerProjectCount">-</h3>
            <p>合作项目数</p>
          </div>
        </div>
      </div>

      <!-- 筛选和搜索 -->
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="搜索单位名称、联系人..." oninput="filterPartners()">
        </div>
        <div class="filters">
          <div class="filter-item">
            <label>类型:</label>
            <select id="filterType" onchange="filterPartners()">
              <option value="">全部</option>
              <option value="政府">政府</option>
              <option value="高校">高校</option>
              <option value="企业">企业</option>
              <option value="社区">社区</option>
            </select>
          </div>
          <div class="filter-item">
            <label>状态:</label>
            <select id="filterStatus" onchange="filterPartners()">
              <option value="">全部</option>
              <option value="合作中">合作中</option>
              <option value="洽谈中">洽谈中</option>
              <option value="已结束">已结束</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 合作伙伴列表 -->
      <div class="card">
        <div class="table-container">
          <table class="table" id="partnersTable">
            <thead>
              <tr>
                <th>单位名称</th>
                <th>类型</th>
                <th>级别</th>
                <th>联系人</th>
                <th>联系电话</th>
                <th>合作项目</th>
                <th>合作开始</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="partnersTableBody">
              <tr>
                <td colspan="9" class="text-center">
                  <div class="loading"><div class="spinner"></div></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 类型分布图 -->
      <div class="card">
        <div class="card-header">
          <h3 class="card-title"><i class="fas fa-chart-pie"></i> 合作伙伴分布</h3>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          <div class="chart-container" style="height:280px;">
            <canvas id="typeChart"></canvas>
          </div>
          <div class="chart-container" style="height:280px;">
            <canvas id="levelChart"></canvas>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑合作伙伴模态框 -->
  <div class="modal-overlay" id="partnerModal">
    <div class="modal" style="max-width:700px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">新增合作伙伴</h3>
        <button class="modal-close" onclick="closeModal('partnerModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="partnerForm">
          <input type="hidden" name="id" id="partnerId">
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label class="form-label">单位名称 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="form-group">
              <label class="form-label">类型 <span class="text-danger">*</span></label>
              <select class="form-control" name="type" required>
                <option value="">请选择</option>
                <option value="政府">政府</option>
                <option value="高校">高校</option>
                <option value="企业">企业</option>
                <option value="社区">社区</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">级别</label>
              <select class="form-control" name="level">
                <option value="">请选择</option>
                <option value="部级">部级</option>
                <option value="省级">省级</option>
                <option value="市级">市级</option>
                <option value="区级">区级</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">联系人</label>
              <input type="text" class="form-control" name="contactPerson">
            </div>
            <div class="form-group">
              <label class="form-label">联系电话</label>
              <input type="tel" class="form-control" name="contactPhone">
            </div>
            <div class="form-group">
              <label class="form-label">合作开始日期</label>
              <input type="date" class="form-control" name="cooperationStart">
            </div>
            <div class="form-group">
              <label class="form-label">合作结束日期</label>
              <input type="date" class="form-control" name="cooperationEnd">
            </div>
            <div class="form-group">
              <label class="form-label">状态</label>
              <select class="form-control" name="status">
                <option value="合作中">合作中</option>
                <option value="洽谈中">洽谈中</option>
                <option value="已结束">已结束</option>
              </select>
            </div>
          </div>
          
          <div class="form-group mt-3">
            <label class="form-label">地址</label>
            <input type="text" class="form-control" name="address">
          </div>
          
          <div class="form-group">
            <label class="form-label">合作项目（多个用换行分隔）</label>
            <textarea class="form-control" name="projectsInput" rows="3" placeholder="请输入合作项目，每行一个"></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">备注</label>
            <textarea class="form-control" name="remark" rows="2"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('partnerModal')">取消</button>
        <button class="btn btn-primary" onclick="savePartner()">保存</button>
      </div>
    </div>
  </div>

  <!-- 详情模态框 -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width:650px;">
      <div class="modal-header">
        <h3 class="modal-title">合作伙伴详情</h3>
        <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
      </div>
      <div class="modal-body" id="detailContent">
        <!-- 动态填充 -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('detailModal')">关闭</button>
        <button class="btn btn-primary" onclick="editFromDetail()">编辑</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">确认删除</h3>
        <button class="modal-close" onclick="closeModal('deleteModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除该合作伙伴吗？此操作不可撤销。</p>
        <p class="text-muted mt-2" id="deleteInfo"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('deleteModal')">取消</button>
        <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

  <script src="js/data-manager.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 全局变量
    let allPartners = [];
    let filteredPartners = [];
    let deleteTargetId = null;
    let detailPartnerId = null;

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
      App.init();
      loadPartners();
    });

    // 加载合作伙伴
    function loadPartners() {
      allPartners = DataManager.getAllPartners();
      updateStats();
      filterPartners();
      renderCharts();
    }

    // 更新统计
    function updateStats() {
      const stats = DataManager.getPartnerStats();
      document.getElementById('partnerTotal').textContent = stats.total;
      document.getElementById('partnerActive').textContent = stats.active;
      document.getElementById('partnerNegotiating').textContent = stats.negotiating;
      
      // 合作项目总数
      let projectCount = 0;
      allPartners.forEach(p => {
        if (p.cooperativeProjects && p.cooperativeProjects.length) {
          projectCount += p.cooperativeProjects.length;
        }
      });
      document.getElementById('partnerProjectCount').textContent = projectCount;
    }

    // 筛选合作伙伴
    function filterPartners() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const status = document.getElementById('filterStatus').value;

      filteredPartners = allPartners.filter(p => {
        const matchSearch = !search || 
          p.name.toLowerCase().includes(search) ||
          (p.contactPerson && p.contactPerson.toLowerCase().includes(search));
        const matchType = !type || p.type === type;
        const matchStatus = !status || p.status === status;
        return matchSearch && matchType && matchStatus;
      });

      renderTable();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('partnersTableBody');

      if (filteredPartners.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="text-center text-muted" style="padding:40px;">
              <i class="fas fa-handshake" style="font-size:48px;display:block;margin-bottom:16px;"></i>
              暂无合作伙伴数据
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filteredPartners.map(p => {
        const projects = p.cooperativeProjects && p.cooperativeProjects.length ? 
          p.cooperativeProjects.slice(0, 2).join('、') + (p.cooperativeProjects.length > 2 ? '...' : '') : '-';
        return `
          <tr onclick="showDetail('${p.id}')" style="cursor:pointer;">
            <td><strong>${p.name}</strong></td>
            <td><span class="tag tag-blue">${p.type || '-'}</span></td>
            <td>${p.level || '-'}</td>
            <td>${p.contactPerson || '-'}</td>
            <td>${p.contactPhone || '-'}</td>
            <td>${projects}</td>
            <td>${App.formatDate(p.cooperationStart)}</td>
            <td><span class="tag ${App.getStatusTagClass(p.status)}">${p.status || '合作中'}</span></td>
            <td class="table-actions" onclick="event.stopPropagation();">
              <button class="btn-edit" onclick="editPartner('${p.id}')"><i class="fas fa-edit"></i></button>
              <button class="btn-delete" onclick="deletePartner('${p.id}')"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 渲染图表
    function renderCharts() {
      const stats = DataManager.getPartnerStats();

      // 类型分布
      const typeData = {
        labels: Object.keys(stats.byType),
        values: Object.values(stats.byType)
      };
      const typeConfig = ChartConfig.getPieConfig(typeData, '类型分布');
      ChartConfig.createChart('typeChart', typeConfig);

      // 级别分布
      const levelData = {
        labels: Object.keys(stats.byLevel),
        values: Object.values(stats.byLevel)
      };
      const levelConfig = ChartConfig.getDoughnutConfig(levelData, '级别分布');
      ChartConfig.createChart('levelChart', levelConfig);
    }

    // 打开新增模态框
    function openAddModal() {
      document.getElementById('modalTitle').textContent = '新增合作伙伴';
      App.resetForm('partnerForm');
      document.getElementById('partnerId').value = '';
      App.openModal('partnerModal');
    }

    // 编辑合作伙伴
    function editPartner(id) {
      const partner = allPartners.find(p => p.id === id);
      if (!partner) return;

      document.getElementById('modalTitle').textContent = '编辑合作伙伴';
      App.fillForm('partnerForm', partner);
      
      // 处理合作项目
      if (partner.cooperativeProjects && partner.cooperativeProjects.length) {
        document.querySelector('[name="projectsInput"]').value = partner.cooperativeProjects.join('\n');
      }
      
      App.openModal('partnerModal');
    }

    // 从详情页编辑
    function editFromDetail() {
      closeModal('detailModal');
      editPartner(detailPartnerId);
    }

    // 保存合作伙伴
    function savePartner() {
      const form = document.getElementById('partnerForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const data = App.getFormData('partnerForm');
      const id = document.getElementById('partnerId').value;
      
      // 处理合作项目
      if (data.projectsInput) {
        data.cooperativeProjects = data.projectsInput.split('\n').map(p => p.trim()).filter(p => p);
        delete data.projectsInput;
      }

      let success;
      if (id) {
        success = DataManager.updatePartner(id, data);
      } else {
        success = DataManager.addPartner(data);
      }

      if (success) {
        App.showToast(id ? '修改成功' : '添加成功', 'success');
        closeModal('partnerModal');
        loadPartners();
      } else {
        App.showToast('保存失败', 'error');
      }
    }

    // 显示详情
    function showDetail(id) {
      detailPartnerId = id;
      const partner = allPartners.find(p => p.id === id);
      if (!partner) return;

      const projects = partner.cooperativeProjects && partner.cooperativeProjects.length ?
        partner.cooperativeProjects.map(p => `<span class="tag tag-blue mb-1 mr-1">${p}</span>`).join('') : '-';

      document.getElementById('detailContent').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div>
            <p class="text-muted mb-1">单位名称</p>
            <p class="mb-3"><strong>${partner.name}</strong></p>
          </div>
          <div>
            <p class="text-muted mb-1">类型</p>
            <p class="mb-3"><span class="tag tag-blue">${partner.type || '-'}</span></p>
          </div>
          <div>
            <p class="text-muted mb-1">级别</p>
            <p class="mb-3">${partner.level || '-'}</p>
          </div>
          <div>
            <p class="text-muted mb-1">状态</p>
            <p class="mb-3"><span class="tag ${App.getStatusTagClass(partner.status)}">${partner.status || '合作中'}</span></p>
          </div>
          <div>
            <p class="text-muted mb-1">联系人</p>
            <p class="mb-3">${partner.contactPerson || '-'}</p>
          </div>
          <div>
            <p class="text-muted mb-1">联系电话</p>
            <p class="mb-3">${partner.contactPhone || '-'}</p>
          </div>
          <div>
            <p class="text-muted mb-1">合作开始</p>
            <p class="mb-3">${App.formatDate(partner.cooperationStart)}</p>
          </div>
          <div>
            <p class="text-muted mb-1">合作结束</p>
            <p class="mb-3">${App.formatDate(partner.cooperationEnd) || '-'}</p>
          </div>
          <div style="grid-column:1/-1;">
            <p class="text-muted mb-1">地址</p>
            <p class="mb-3">${partner.address || '-'}</p>
          </div>
          <div style="grid-column:1/-1;">
            <p class="text-muted mb-1">合作项目</p>
            <p class="mb-3">${projects}</p>
          </div>
          <div style="grid-column:1/-1;">
            <p class="text-muted mb-1">备注</p>
            <p class="mb-3">${partner.remark || '-'}</p>
          </div>
        </div>
      `;

      App.openModal('detailModal');
    }

    // 删除合作伙伴
    function deletePartner(id) {
      const partner = allPartners.find(p => p.id === id);
      if (!partner) return;

      deleteTargetId = id;
      document.getElementById('deleteInfo').textContent = partner.name;
      App.openModal('deleteModal');
    }

    // 确认删除
    function confirmDelete() {
      if (!deleteTargetId) return;

      const success = DataManager.deletePartner(deleteTargetId);
      if (success) {
        App.showToast('删除成功', 'success');
        closeModal('deleteModal');
        loadPartners();
      } else {
        App.showToast('删除失败', 'error');
      }
      deleteTargetId = null;
    }

    // 导出合作伙伴
    function exportPartners() {
      const headers = [
        { key: 'name', label: '单位名称' },
        { key: 'type', label: '类型' },
        { key: 'level', label: '级别' },
        { key: 'contactPerson', label: '联系人' },
        { key: 'contactPhone', label: '联系电话' },
        { key: 'address', label: '地址' },
        { key: 'cooperationStart', label: '合作开始' },
        { key: 'cooperationEnd', label: '合作结束' },
        { key: 'status', label: '状态' },
        { key: 'remark', label: '备注' }
      ];
      App.exportCSV(filteredPartners, headers, '合作伙伴');
    }

    // 关闭模态框
    function closeModal(modalId) {
      App.closeModal(modalId);
    }
  </script>
</body>
</html>
