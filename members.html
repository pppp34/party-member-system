<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>党员管理 - 党员管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>党员管理系统</h1>
        <p>乡村振兴学院</p>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>首页看板</span>
        </a>
        <a href="members.html" class="nav-item active">
          <i class="fas fa-users"></i>
          <span>党员管理</span>
        </a>
        <a href="portrait.html" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>党员画像</span>
        </a>
        <a href="stats.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>
          <span>支部画像</span>
        </a>
        <a href="partners.html" class="nav-item">
          <i class="fas fa-handshake"></i>
          <span>合作伙伴</span>
        </a>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">党员管理</h2>
        <div class="btn-group">
          <button class="btn btn-secondary" onclick="exportMembers()">
            <i class="fas fa-download"></i> 导出
          </button>
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">
            <i class="fas fa-upload"></i> 导入
          </button>
          <input type="file" id="importFile" accept=".csv,.xlsx,.xls" style="display:none" onchange="importMembers(event)">
          <button class="btn btn-primary" onclick="openAddModal()">
            <i class="fas fa-plus"></i> 新增党员
          </button>
        </div>
      </div>

      <!-- 搜索和过滤 -->
      <div class="toolbar">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="搜索姓名、手机号、身份证号..." oninput="filterMembers()">
        </div>
        <div class="filters">
          <div class="filter-item">
            <label>支部:</label>
            <select id="filterBranch" onchange="filterMembers()">
              <option value="">全部</option>
            </select>
          </div>
          <div class="filter-item">
            <label>类型:</label>
            <select id="filterType" onchange="filterMembers()">
              <option value="">全部</option>
              <option value="正式党员">正式党员</option>
              <option value="预备党员">预备党员</option>
            </select>
          </div>
          <div class="filter-item">
            <label>状态:</label>
            <select id="filterStatus" onchange="filterMembers()">
              <option value="">全部</option>
              <option value="正常">正常</option>
              <option value="流动">流动</option>
              <option value="失联">失联</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 党员列表 -->
      <div class="card">
        <div class="table-container">
          <table class="table" id="membersTable">
            <thead>
              <tr>
                <th>姓名</th>
                <th>性别</th>
                <th>年龄</th>
                <th>学历</th>
                <th>所属支部</th>
                <th>党员类型</th>
                <th>入党时间</th>
                <th>联系方式</th>
                <th>状态</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="membersTableBody">
              <tr>
                <td colspan="10" class="text-center">
                  <div class="loading"><div class="spinner"></div></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <!-- 分页 -->
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑党员模态框 -->
  <div class="modal-overlay" id="memberModal">
    <div class="modal" style="max-width:800px;">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">新增党员</h3>
        <button class="modal-close" onclick="closeModal('memberModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="memberForm">
          <input type="hidden" name="id" id="memberId">
          
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label class="form-label">姓名 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="name" required>
            </div>
            <div class="form-group">
              <label class="form-label">性别 <span class="text-danger">*</span></label>
              <select class="form-control" name="gender" required>
                <option value="">请选择</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">身份证号 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="idCard" required minlength="18" maxlength="18">
            </div>
            <div class="form-group">
              <label class="form-label">出生日期</label>
              <input type="date" class="form-control" name="birthDate">
            </div>
            <div class="form-group">
              <label class="form-label">民族</label>
              <input type="text" class="form-control" name="nation" placeholder="如：汉族">
            </div>
            <div class="form-group">
              <label class="form-label">学历</label>
              <select class="form-control" name="education">
                <option value="">请选择</option>
                <option value="博士">博士</option>
                <option value="硕士">硕士</option>
                <option value="本科">本科</option>
                <option value="大专">大专</option>
                <option value="高中">高中</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">手机号码</label>
              <input type="tel" class="form-control" name="phone">
            </div>
            <div class="form-group">
              <label class="form-label">电子邮箱</label>
              <input type="email" class="form-control" name="email">
            </div>
            <div class="form-group">
              <label class="form-label">所属支部 <span class="text-danger">*</span></label>
              <select class="form-control" name="branch" required>
                <option value="">请选择</option>
                <option value="现代农业系党支部">现代农业系党支部</option>
                <option value="社会化服务系党支部">社会化服务系党支部</option>
                <option value="新农人研培中心党支部">新农人研培中心党支部</option>
                <option value="学院办公室党支部">学院办公室党支部</option>
                <option value="学院党委">学院党委</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">党员类型 <span class="text-danger">*</span></label>
              <select class="form-control" name="type" required>
                <option value="">请选择</option>
                <option value="正式党员">正式党员</option>
                <option value="预备党员">预备党员</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">入党日期</label>
              <input type="date" class="form-control" name="joinDate">
            </div>
            <div class="form-group">
              <label class="form-label">转正日期</label>
              <input type="date" class="form-control" name="formalDate">
            </div>
            <div class="form-group">
              <label class="form-label">行政职务</label>
              <input type="text" class="form-control" name="position">
            </div>
            <div class="form-group">
              <label class="form-label">党内职务</label>
              <input type="text" class="form-control" name="partyPosition">
            </div>
            <div class="form-group">
              <label class="form-label">状态</label>
              <select class="form-control" name="status">
                <option value="正常">正常</option>
                <option value="流动">流动</option>
                <option value="失联">失联</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">工作单位</label>
              <input type="text" class="form-control" name="workUnit" value="江苏开放大学乡村振兴学院">
            </div>
          </div>
          
          <div class="form-group mt-3">
            <label class="form-label">标签（多个用逗号分隔）</label>
            <input type="text" class="form-control" name="tagsInput" placeholder="如：优秀党员,教学骨干">
          </div>
          
          <div class="form-group">
            <label class="form-label">备注</label>
            <textarea class="form-control" name="remark" rows="3"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('memberModal')">取消</button>
        <button class="btn btn-primary" onclick="saveMember()">保存</button>
      </div>
    </div>
  </div>

  <!-- 删除确认模态框 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h3 class="modal-title">确认删除</h3>
        <button class="modal-close" onclick="closeModal('deleteModal')">&times;</button>
      </div>
      <div class="modal-body">
        <p>确定要删除该党员信息吗？此操作不可撤销。</p>
        <p class="text-muted mt-2" id="deleteInfo"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('deleteModal')">取消</button>
        <button class="btn btn-danger" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

  <script src="js/data-manager.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 全局变量
    let allMembers = [];
    let filteredMembers = [];
    let currentPage = 1;
    const pageSize = 10;
    let deleteTargetId = null;

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
      App.init();
      loadMembers();
      loadFilters();
    });

    // 加载党员列表
    function loadMembers() {
      allMembers = DataManager.getAllMembers();
      filterMembers();
    }

    // 加载筛选器选项
    function loadFilters() {
      const stats = DataManager.getMemberStats();
      const branchSelect = document.getElementById('filterBranch');
      
      // 添加支部选项
      Object.keys(stats.byBranch).forEach(branch => {
        const option = document.createElement('option');
        option.value = branch;
        option.textContent = branch;
        branchSelect.appendChild(option);
      });
    }

    // 筛选党员
    function filterMembers() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const branch = document.getElementById('filterBranch').value;
      const type = document.getElementById('filterType').value;
      const status = document.getElementById('filterStatus').value;

      filteredMembers = allMembers.filter(m => {
        const matchSearch = !search || 
          m.name.toLowerCase().includes(search) ||
          (m.phone && m.phone.includes(search)) ||
          (m.idCard && m.idCard.includes(search));
        const matchBranch = !branch || m.branch === branch;
        const matchType = !type || m.type === type;
        const matchStatus = !status || m.status === status;
        return matchSearch && matchBranch && matchType && matchStatus;
      });

      currentPage = 1;
      renderTable();
      renderPagination();
    }

    // 渲染表格
    function renderTable() {
      const tbody = document.getElementById('membersTableBody');
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredMembers.slice(start, end);

      if (pageData.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="10" class="text-center text-muted" style="padding:40px;">
              <i class="fas fa-users" style="font-size:48px;display:block;margin-bottom:16px;"></i>
              暂无党员数据
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = pageData.map(m => {
        const age = App.calculateAge(m.birthDate);
        return `
          <tr onclick="window.location.href='portrait.html?id=${m.id}'" style="cursor:pointer;">
            <td><strong>${m.name}</strong></td>
            <td>${m.gender || '-'}</td>
            <td>${age ? age + '岁' : '-'}</td>
            <td>${m.education || '-'}</td>
            <td>${m.branch || '-'}</td>
            <td><span class="tag ${App.getStatusTagClass(m.type)}">${m.type || '-'}</span></td>
            <td>${App.formatDate(m.joinDate)}</td>
            <td>${m.phone || '-'}</td>
            <td><span class="tag ${App.getStatusTagClass(m.status)}">${m.status || '正常'}</span></td>
            <td class="table-actions" onclick="event.stopPropagation();">
              <button class="btn-edit" onclick="editMember('${m.id}')"><i class="fas fa-edit"></i></button>
              <button class="btn-delete" onclick="deleteMember('${m.id}')"><i class="fas fa-trash"></i></button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 渲染分页
    function renderPagination() {
      const totalPages = Math.ceil(filteredMembers.length / pageSize);
      const container = document.getElementById('pagination');
      
      if (totalPages <= 1) {
        container.innerHTML = '';
        return;
      }

      let html = '';
      
      // 上一页
      html += `<button ${currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${currentPage - 1})">
        <i class="fas fa-chevron-left"></i>
      </button>`;

      // 页码
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          html += '<button disabled>...</button>';
        }
      }

      // 下一页
      html += `<button ${currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${currentPage + 1})">
        <i class="fas fa-chevron-right"></i>
      </button>`;

      container.innerHTML = html;
    }

    // 跳转到指定页
    function goToPage(page) {
      currentPage = page;
      renderTable();
      renderPagination();
    }

    // 打开新增模态框
    function openAddModal() {
      document.getElementById('modalTitle').textContent = '新增党员';
      App.resetForm('memberForm');
      document.getElementById('memberId').value = '';
      App.openModal('memberModal');
    }

    // 编辑党员
    function editMember(id) {
      const member = DataManager.getMemberById(id);
      if (!member) return;

      document.getElementById('modalTitle').textContent = '编辑党员';
      App.fillForm('memberForm', member);
      
      // 处理标签
      if (member.tags && Array.isArray(member.tags)) {
        document.querySelector('[name="tagsInput"]').value = member.tags.join(',');
      }
      
      App.openModal('memberModal');
    }

    // 保存党员
    function saveMember() {
      const form = document.getElementById('memberForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const data = App.getFormData('memberForm');
      const id = document.getElementById('memberId').value;
      
      // 处理标签
      if (data.tagsInput) {
        data.tags = data.tagsInput.split(',').map(t => t.trim()).filter(t => t);
        delete data.tagsInput;
      }

      let success;
      if (id) {
        success = DataManager.updateMember(id, data);
      } else {
        success = DataManager.addMember(data);
      }

      if (success) {
        App.showToast(id ? '修改成功' : '添加成功', 'success');
        closeModal('memberModal');
        loadMembers();
      } else {
        App.showToast('保存失败', 'error');
      }
    }

    // 删除党员
    function deleteMember(id) {
      const member = DataManager.getMemberById(id);
      if (!member) return;

      deleteTargetId = id;
      document.getElementById('deleteInfo').textContent = `${member.name} - ${member.branch}`;
      App.openModal('deleteModal');
    }

    // 确认删除
    function confirmDelete() {
      if (!deleteTargetId) return;

      const success = DataManager.deleteMember(deleteTargetId);
      if (success) {
        App.showToast('删除成功', 'success');
        closeModal('deleteModal');
        loadMembers();
      } else {
        App.showToast('删除失败', 'error');
      }
      deleteTargetId = null;
    }

    // 导出党员
    function exportMembers() {
      const headers = [
        { key: 'name', label: '姓名' },
        { key: 'gender', label: '性别' },
        { key: 'idCard', label: '身份证号' },
        { key: 'phone', label: '手机' },
        { key: 'birthDate', label: '出生日期' },
        { key: 'nation', label: '民族' },
        { key: 'education', label: '学历' },
        { key: 'branch', label: '所属支部' },
        { key: 'type', label: '党员类型' },
        { key: 'joinDate', label: '入党日期' },
        { key: 'formalDate', label: '转正日期' },
        { key: 'position', label: '行政职务' },
        { key: 'partyPosition', label: '党内职务' },
        { key: 'status', label: '状态' },
        { key: 'workUnit', label: '工作单位' },
        { key: 'remark', label: '备注' }
      ];
      App.exportCSV(filteredMembers, headers, '党员信息');
    }

    // 导入党员
    function importMembers(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          // 简单CSV解析
          const text = e.target.result;
          const lines = text.split('\n').filter(l => l.trim());
          if (lines.length < 2) {
            App.showToast('文件格式错误或无数据', 'error');
            return;
          }

          const headers = lines[0].split(',').map(h => h.trim());
          const data = [];
          
          for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
            const item = {};
            headers.forEach((h, idx) => {
              item[h] = values[idx] || '';
            });
            if (item['姓名']) data.push(item);
          }

          if (data.length === 0) {
            App.showToast('未找到有效数据', 'error');
            return;
          }

          // 映射字段
          const mappedData = data.map(item => ({
            name: item['姓名'] || '',
            gender: item['性别'] || '',
            idCard: item['身份证号'] || '',
            phone: item['手机'] || '',
            birthDate: item['出生日期'] || '',
            nation: item['民族'] || '',
            education: item['学历'] || '',
            branch: item['所属支部'] || '',
            type: item['党员类型'] || '正式党员',
            joinDate: item['入党日期'] || '',
            formalDate: item['转正日期'] || '',
            position: item['行政职务'] || '',
            partyPosition: item['党内职务'] || '',
            status: item['状态'] || '正常',
            workUnit: item['工作单位'] || '',
            remark: item['备注'] || ''
          }));

          const result = DataManager.importMembers(mappedData);
          App.showToast(`导入完成：新增${result.added}条，跳过${result.skipped}条已存在记录`, 'success');
          loadMembers();
        } catch (err) {
          App.showToast('导入失败：' + err.message, 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // 关闭模态框
    function closeModal(modalId) {
      App.closeModal(modalId);
    }
  </script>
</body>
</html>
