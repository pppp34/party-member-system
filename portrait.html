<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>党员画像 - 党员管理系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 党员画像专用样式 ===== */
    .portrait-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
    }

    /* 左侧信息卡 */
    .member-info-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      padding: 24px;
      height: fit-content;
      position: sticky;
      top: 24px;
    }

    .member-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .member-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #c41e3a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 28px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .member-header-info h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .member-header-info p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .member-status-tag {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: rgba(196, 30, 58, 0.1);
      color: #c41e3a;
      font-weight: 500;
    }

    .member-status-tag.normal {
      background: rgba(40, 167, 69, 0.1);
      color: #28a745;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: #c41e3a;
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .info-item .label {
      color: #999;
      flex-shrink: 0;
    }

    .info-item .value {
      color: #333;
      font-weight: 500;
      word-break: break-all;
    }

    .tags-section {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-pill {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
    }

    .tag-pill.red { background: rgba(196, 30, 58, 0.1); color: #c41e3a; }
    .tag-pill.green { background: rgba(40, 167, 69, 0.1); color: #28a745; }
    .tag-pill.blue { background: rgba(23, 162, 184, 0.1); color: #17a2b8; }
    .tag-pill.yellow { background: rgba(255, 193, 7, 0.1); color: #e6a700; }
    .tag-pill.purple { background: rgba(111, 66, 193, 0.1); color: #6f42c1; }
    .tag-pill.orange { background: rgba(253, 126, 20, 0.1); color: #fd7e14; }

    .add-tag-btn {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      border: 1px dashed #ccc;
      background: transparent;
      color: #999;
      cursor: pointer;
    }

    /* 右侧内容 */
    .portrait-right {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* 统计卡片行 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .stat-mini {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-mini-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .stat-mini-icon.red { background: rgba(196, 30, 58, 0.08); color: #c41e3a; }
    .stat-mini-icon.blue { background: rgba(23, 162, 184, 0.08); color: #17a2b8; }
    .stat-mini-icon.orange { background: rgba(253, 126, 20, 0.08); color: #fd7e14; }
    .stat-mini-icon.purple { background: rgba(111, 66, 193, 0.08); color: #6f42c1; }

    .stat-mini-info h4 {
      font-size: 24px;
      font-weight: 700;
      color: #333;
      line-height: 1;
    }

    .stat-mini-info p {
      font-size: 13px;
      color: #999;
      margin-top: 4px;
    }

    /* 轨迹区域 */
    .timeline-section {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      padding: 24px;
    }

    .timeline-section-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .timeline-section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: #c41e3a;
      border-radius: 2px;
    }

    /* 分类筛选 */
    .timeline-filters {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eee;
    }

    .timeline-filter-group {
      display: flex;
      gap: 8px;
    }

    .timeline-filter-btn {
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 13px;
      border: none;
      background: #f5f5f5;
      color: #666;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }

    .timeline-filter-btn:hover {
      background: #e8e8e8;
    }

    .timeline-filter-btn.active {
      background: #c41e3a;
      color: white;
    }

    /* 子筛选 */
    .timeline-sub-filters {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      padding-left: 4px;
    }

    .timeline-sub-filter {
      font-size: 13px;
      color: #999;
      cursor: pointer;
      position: relative;
      padding-bottom: 4px;
    }

    .timeline-sub-filter.active {
      color: #c41e3a;
      font-weight: 500;
    }

    .timeline-sub-filter .badge {
      position: absolute;
      top: -6px;
      right: -18px;
      background: #c41e3a;
      color: white;
      font-size: 10px;
      padding: 0 5px;
      border-radius: 8px;
      line-height: 14px;
    }

    /* 时间线 */
    .portrait-timeline {
      position: relative;
      padding-left: 20px;
    }

    .portrait-timeline::before {
      content: '';
      position: absolute;
      left: 5px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #eee;
    }

    .pt-item {
      position: relative;
      padding-bottom: 24px;
    }

    .pt-item:last-child {
      padding-bottom: 0;
    }

    .pt-dot {
      position: absolute;
      left: -20px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #c41e3a;
      border: 2px solid white;
      box-shadow: 0 0 0 2px rgba(196, 30, 58, 0.2);
    }

    .pt-time {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .pt-content {
      background: #f8f9fa;
      padding: 12px 16px;
      border-radius: 8px;
    }

    .pt-type {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .pt-type.event { background: rgba(196, 30, 58, 0.08); color: #c41e3a; }
    .pt-type.study { background: rgba(23, 162, 184, 0.08); color: #17a2b8; }
    .pt-type.meeting { background: rgba(111, 66, 193, 0.08); color: #6f42c1; }
    .pt-type.volunteer { background: rgba(40, 167, 69, 0.08); color: #28a745; }
    .pt-type.task { background: rgba(253, 126, 20, 0.08); color: #fd7e14; }
    .pt-type.medal { background: rgba(255, 193, 7, 0.12); color: #e6a700; }
    .pt-type.payment { background: rgba(108, 117, 125, 0.08); color: #6c757d; }

    .pt-title {
      font-weight: 600;
      color: #333;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .pt-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    .pt-status {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }

    .pt-status.done { background: rgba(40, 167, 69, 0.1); color: #28a745; }
    .pt-status.pending { background: rgba(253, 126, 20, 0.1); color: #fd7e14; }

    /* 成员选择器 */
    .member-selector {
      background: #fff;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-selector label {
      font-weight: 500;
      font-size: 14px;
      color: #666;
      flex-shrink: 0;
    }

    .member-selector select {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
    }

    /* 响应式 */
    @media (max-width: 1024px) {
      .portrait-layout {
        grid-template-columns: 1fr;
      }
      .member-info-card {
        position: static;
      }
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 640px) {
      .stats-row {
        grid-template-columns: 1fr;
      }
      .timeline-filters {
        flex-wrap: wrap;
      }
      .timeline-sub-filters {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>党员管理系统</h1>
        <p>乡村振兴学院</p>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item">
          <i class="fas fa-home"></i>
          <span>首页看板</span>
        </a>
        <a href="members.html" class="nav-item">
          <i class="fas fa-users"></i>
          <span>党员管理</span>
        </a>
        <a href="portrait.html" class="nav-item active">
          <i class="fas fa-user-circle"></i>
          <span>党员画像</span>
        </a>
        <a href="stats.html" class="nav-item">
          <i class="fas fa-chart-pie"></i>
          <span>支部画像</span>
        </a>
        <a href="partners.html" class="nav-item">
          <i class="fas fa-handshake"></i>
          <span>合作伙伴</span>
        </a>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <div class="page-header">
        <h2 class="page-title">党员画像</h2>
      </div>

      <!-- 党员选择器 -->
      <div class="member-selector mb-4">
        <label><i class="fas fa-user-tag"></i> 选择党员：</label>
        <select id="memberSelect" onchange="switchMember(this.value)">
          <option value="">请选择党员</option>
        </select>
      </div>

      <div class="portrait-layout" id="portraitContainer">
        <!-- 左侧：个人信息卡 -->
        <div class="member-info-card">
          <div class="member-header">
            <div class="member-avatar" id="memberAvatar">张</div>
            <div class="member-header-info">
              <h3 id="memberName">-</h3>
              <p id="memberBranch">-</p>
              <span class="member-status-tag" id="memberType">正式党员</span>
            </div>
          </div>

          <div class="section-title">基本信息</div>
          <div class="info-grid" id="basicInfo">
            <!-- 动态填充 -->
          </div>

          <div class="section-title">详细信息</div>
          <div class="info-grid" id="detailInfo">
            <!-- 动态填充 -->
          </div>

          <div class="section-title">党员标签</div>
          <div class="tags-section" id="memberTags">
            <!-- 动态填充 -->
          </div>
        </div>

        <!-- 右侧：统计数据 + 生活轨迹 -->
        <div class="portrait-right">
          <!-- 统计卡片行 -->
          <div class="stats-row" id="statsRow">
            <div class="stat-mini">
              <div class="stat-mini-icon red">
                <i class="fas fa-star"></i>
              </div>
              <div class="stat-mini-info">
                <h4 id="statPoints">0</h4>
                <p>党员积分</p>
              </div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-icon blue">
                <i class="fas fa-book"></i>
              </div>
              <div class="stat-mini-info">
                <h4 id="statNotes">0</h4>
                <p>学习笔记</p>
              </div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-icon orange">
                <i class="fas fa-calendar-check"></i>
              </div>
              <div class="stat-mini-info">
                <h4 id="statLife">0</h4>
                <p>党内生活</p>
              </div>
            </div>
            <div class="stat-mini">
              <div class="stat-mini-icon purple">
                <i class="fas fa-wallet"></i>
              </div>
              <div class="stat-mini-info">
                <h4 id="statPayment">0</h4>
                <p>党费缴纳</p>
              </div>
            </div>
          </div>

          <!-- 生活轨迹 -->
          <div class="timeline-section">
            <div class="timeline-section-title">党员生活轨迹</div>

            <!-- 一级筛选 -->
            <div class="timeline-filters">
              <div class="timeline-filter-group">
                <button class="timeline-filter-btn active" data-filter="all" onclick="filterTrace('all')">全部</button>
                <button class="timeline-filter-btn" data-filter="党员发展" onclick="filterTrace('党员发展')">党员发展</button>
                <button class="timeline-filter-btn" data-filter="学习历程" onclick="filterTrace('学习历程')">学习历程</button>
                <button class="timeline-filter-btn" data-filter="三会一课" onclick="filterTrace('三会一课')">三会一课</button>
                <button class="timeline-filter-btn" data-filter="志愿者" onclick="filterTrace('志愿者')">志愿者</button>
                <button class="timeline-filter-btn" data-filter="我的帮扶" onclick="filterTrace('我的帮扶')">我的帮扶</button>
              </div>
            </div>

            <!-- 二级筛选 -->
            <div class="timeline-sub-filters">
              <span class="timeline-sub-filter active" data-sub="我的任务" onclick="filterSubTrace('我的任务')">我的任务 <span class="badge" id="badgeTask">0</span></span>
              <span class="timeline-sub-filter" data-sub="积分" onclick="filterSubTrace('积分')">积分 <span class="badge" id="badgePoints">0</span></span>
              <span class="timeline-sub-filter" data-sub="我的勋章" onclick="filterSubTrace('我的勋章')">我的勋章 <span class="badge" id="badgeMedal">0</span></span>
              <span class="timeline-sub-filter" data-sub="我的活动" onclick="filterSubTrace('我的活动')">我的活动 <span class="badge" id="badgeActivity">0</span></span>
            </div>

            <!-- 时间线 -->
            <div class="portrait-timeline" id="timelineContent">
              <!-- 动态填充 -->
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data-manager.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 全局状态
    let currentMember = null;
    let currentBehavior = null;
    let activeFilter = 'all';
    let activeSubFilter = '我的任务';

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
      App.init();
      initMemberSelector();
    });

    // 初始化党员选择器
    function initMemberSelector() {
      const members = DataManager.getAllMembers();
      const select = document.getElementById('memberSelect');

      members.forEach(m => {
        const option = document.createElement('option');
        option.value = m.id;
        option.textContent = `${m.name} - ${m.branch}`;
        select.appendChild(option);
      });

      // URL参数或默认选择第一个
      const params = new URLSearchParams(window.location.search);
      const memberId = params.get('id');
      if (memberId) {
        select.value = memberId;
        switchMember(memberId);
      } else if (members.length > 0) {
        select.value = members[0].id;
        switchMember(members[0].id);
      }
    }

    // 切换党员
    function switchMember(memberId) {
      if (!memberId) return;

      currentMember = DataManager.getMemberById(memberId);
      currentBehavior = DataManager.getMemberBehavior(memberId);

      if (!currentMember) return;

      // 如果该党员没有行为数据，自动生成示例数据
      if (!currentBehavior || !currentBehavior.points && (!currentBehavior.notes || currentBehavior.notes.length === 0)) {
        generateSampleBehavior(memberId);
        currentBehavior = DataManager.getMemberBehavior(memberId);
      }

      // 更新URL
      const url = new URL(window.location);
      url.searchParams.set('id', memberId);
      window.history.replaceState({}, '', url);

      renderMemberInfo();
      renderStats();
      updateBadges();
      renderTimeline();
    }

    // 生成示例行为数据
    function generateSampleBehavior(memberId) {
      const behavior = {
        points: Math.floor(Math.random() * 30) + 40,
        notes: [
          { id: DataManager.generateId(), type: '学习历程', title: '学习党的二十大精神', date: '2024-01-15', content: '参加支部组织的党的二十大精神学习会议，认真学习了党的二十大报告全文，撰写了学习心得体会。', createdAt: '2024-01-15T09:00:00Z' },
          { id: DataManager.generateId(), type: '学习历程', title: '学习新党章', date: '2024-02-20', content: '系统学习了新修订的《中国共产党章程》，对新修订内容进行了深入理解。', createdAt: '2024-02-20T10:00:00Z' },
          { id: DataManager.generateId(), type: '学习历程', title: '习近平新时代中国特色社会主义思想专题学习', date: '2024-03-10', content: '参加"学思想、强党性、重实践、建新功"主题教育专题学习。', createdAt: '2024-03-10T14:00:00Z' }
        ],
        lifeEvents: [
          { id: DataManager.generateId(), type: '党员发展', title: '成为预备党员', date: currentMember.joinDate || '2012-06-15', content: '经过党支部大会讨论通过，成为中国共产党预备党员。', createdAt: (currentMember.joinDate || '2012-06-15') + 'T00:00:00Z' }
        ],
        meetingRecords: [
          { id: DataManager.generateId(), type: '三会一课', title: '支部党员大会', date: '2024-01-10', content: '参加支部党员大会，讨论年度工作计划和党员发展事宜。', createdAt: '2024-01-10T14:00:00Z' },
          { id: DataManager.generateId(), type: '三会一课', title: '主题党日活动', date: '2024-02-28', content: '参加"学党史、悟思想"主题党日活动。', createdAt: '2024-02-28T09:00:00Z' },
          { id: DataManager.generateId(), type: '三会一课', title: '党课学习', date: '2024-03-15', content: '参加支部书记讲党课活动，学习习近平新时代中国特色社会主义思想。', createdAt: '2024-03-15T14:30:00Z' }
        ],
        volunteerRecords: [
          { id: DataManager.generateId(), type: '志愿者', title: '社区志愿服务', date: '2024-03-05', content: '参加"学雷锋"志愿服务活动，为社区居民提供政策咨询服务。', createdAt: '2024-03-05T09:00:00Z' },
          { id: DataManager.generateId(), type: '志愿者', title: '乡村振兴帮扶', date: '2024-03-20', content: '赴八卦洲街道开展乡村振兴调研，为当地农户提供技术指导。', createdAt: '2024-03-20T08:00:00Z' }
        ],
        specialRecords: [
          { id: DataManager.generateId(), type: '我的帮扶', title: '帮扶困难党员', date: '2024-02-01', content: '对支部困难党员开展帮扶工作，协助解决生活和工作中的实际困难。', createdAt: '2024-02-01T10:00:00Z' }
        ],
        taskRecords: [
          { id: DataManager.generateId(), type: '我的任务', title: '完成年度考核任务', date: '2024-01-31', content: '按时完成年度党员民主评议和个人年度工作总结。', status: '已完成', createdAt: '2024-01-31T16:00:00Z' },
          { id: DataManager.generateId(), type: '我的任务', title: '提交学习心得', date: '2024-02-15', content: '提交党的二十大精神学习心得体会一篇。', status: '已完成', createdAt: '2024-02-15T11:00:00Z' },
          { id: DataManager.generateId(), type: '我的任务', title: '参加组织生活会', date: '2024-03-25', content: '准备组织生活会发言材料，开展批评与自我批评。', status: '待完成', createdAt: '2024-03-25T09:00:00Z' }
        ],
        medalRecords: [
          { id: DataManager.generateId(), type: '我的勋章', title: '优秀共产党员', date: '2023-07-01', content: '获评年度优秀共产党员称号。', level: '校级', createdAt: '2023-07-01T00:00:00Z' }
        ],
        activityRecords: [
          { id: DataManager.generateId(), type: '我的活动', title: '学习贯彻党的二十大精神专题党课', date: '2024-01-15', content: '参加学院组织的党的二十大精神专题党课学习活动。', createdAt: '2024-01-15T09:00:00Z' },
          { id: DataManager.generateId(), type: '我的活动', title: '赴八卦洲开展乡村振兴调研实践活动', date: '2024-03-20', content: '参加乡村振兴调研实践活动，深入基层了解实际情况。', createdAt: '2024-03-20T08:00:00Z' }
        ],
        paymentRecords: [
          { id: DataManager.generateId(), type: '党费缴纳', title: '2024年第一季度党费', date: '2024-03-31', amount: 36, content: '按时缴纳2024年第一季度党费。', createdAt: '2024-03-31T10:00:00Z' },
          { id: DataManager.generateId(), type: '党费缴纳', title: '2024年第二季度党费', date: '2024-06-30', amount: 36, content: '按时缴纳2024年第二季度党费。', createdAt: '2024-06-30T10:00:00Z' }
        ]
      };
      DataManager.saveMemberBehavior(memberId, behavior);
    }

    // 渲染个人信息
    function renderMemberInfo() {
      const m = currentMember;
      const age = App.calculateAge(m.birthDate);
      const partyAge = App.calculatePartyAge(m.joinDate);

      // 头像
      document.getElementById('memberAvatar').textContent = m.name ? m.name.charAt(0) : '?';
      document.getElementById('memberName').textContent = m.name || '-';
      document.getElementById('memberBranch').textContent = m.branch || '-';
      document.getElementById('memberType').textContent = m.type || '正式党员';

      // 基本信息
      const basicInfo = document.getElementById('basicInfo');
      basicInfo.innerHTML = `
        <div class="info-item">
          <span class="label">年龄：</span>
          <span class="value">${age ? age + '岁' : '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">身份证号：</span>
          <span class="value">${m.idCard ? m.idCard.substring(0, 6) + '****' + m.idCard.substring(14) : '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">电话：</span>
          <span class="value">${m.phone || '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">入党时间：</span>
          <span class="value">${App.formatDate(m.joinDate)}</span>
        </div>
        <div class="info-item">
          <span class="label">党龄：</span>
          <span class="value">${partyAge ? partyAge + '年' : '-'}</span>
        </div>
      `;

      // 详细信息
      const detailInfo = document.getElementById('detailInfo');
      detailInfo.innerHTML = `
        <div class="info-item">
          <span class="label">党员编号：</span>
          <span class="value">${m.idCard ? m.idCard.substring(0, 10) : '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">籍贯：</span>
          <span class="value">${m.residence ? m.residence.split('市')[0] + '市' : '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">毕业院校：</span>
          <span class="value">${m.workUnit ? m.workUnit.replace('江苏开放大学', '') : '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">民族：</span>
          <span class="value">${m.nation || '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">邮箱：</span>
          <span class="value">${m.email || '-'}</span>
        </div>
        <div class="info-item">
          <span class="label">学历：</span>
          <span class="value">${m.education || '-'}</span>
        </div>
      `;

      // 标签
      const tagsContainer = document.getElementById('memberTags');
      if (m.tags && m.tags.length) {
        const colors = ['red', 'green', 'blue', 'yellow', 'purple', 'orange'];
        tagsContainer.innerHTML = m.tags.map((tag, i) =>
          `<span class="tag-pill ${colors[i % colors.length]}">${tag}</span>`
        ).join('');
      } else {
        tagsContainer.innerHTML = '<span class="text-muted" style="font-size:13px;">暂无标签</span>';
      }
    }

    // 渲染统计
    function renderStats() {
      const b = currentBehavior;
      document.getElementById('statPoints').textContent = b.points || 0;
      document.getElementById('statNotes').textContent = b.notes ? b.notes.length : 0;

      // 党内生活 = 三会一课 + 活动
      const lifeCount = (b.meetingRecords ? b.meetingRecords.length : 0)
                      + (b.activityRecords ? b.activityRecords.length : 0);
      document.getElementById('statLife').textContent = lifeCount;

      // 党费总额
      const totalPayment = b.paymentRecords ?
        b.paymentRecords.reduce((sum, p) => sum + (p.amount || 0), 0) : 0;
      document.getElementById('statPayment').textContent = totalPayment + '元';
    }

    // 更新徽章数
    function updateBadges() {
      const b = currentBehavior;
      document.getElementById('badgeTask').textContent = b.taskRecords ? b.taskRecords.length : 0;
      document.getElementById('badgePoints').textContent = b.points || 0;
      document.getElementById('badgeMedal').textContent = b.medalRecords ? b.medalRecords.length : 0;
      document.getElementById('badgeActivity').textContent = b.activityRecords ? b.activityRecords.length : 0;
    }

    // 筛选轨迹
    function filterTrace(type) {
      activeFilter = type;

      // 更新按钮状态
      document.querySelectorAll('.timeline-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === type);
      });

      renderTimeline();
    }

    // 子筛选
    function filterSubTrace(type) {
      activeSubFilter = type;

      // 更新按钮状态
      document.querySelectorAll('.timeline-sub-filter').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sub === type);
      });

      renderTimeline();
    }

    // 渲染时间线
    function renderTimeline() {
      const b = currentBehavior;
      if (!b) {
        document.getElementById('timelineContent').innerHTML = '<p class="text-muted">暂无数据</p>';
        return;
      }

      let allTraces = [];

      if (activeFilter === 'all') {
        // 全部类别
        allTraces = [
          ...(b.lifeEvents || []),
          ...(b.notes || []),
          ...(b.meetingRecords || []),
          ...(b.volunteerRecords || []),
          ...(b.specialRecords || []),
          ...(b.taskRecords || []),
          ...(b.medalRecords || []),
          ...(b.activityRecords || []),
          ...(b.paymentRecords || [])
        ];
      } else {
        // 按类型筛选
        const map = {
          '党员发展': b.lifeEvents,
          '学习历程': b.notes,
          '三会一课': b.meetingRecords,
          '志愿者': b.volunteerRecords,
          '我的帮扶': b.specialRecords
        };
        allTraces = map[activeFilter] || [];
      }

      // 按子筛选进一步过滤
      if (activeSubFilter && activeFilter === 'all') {
        const subMap = {
          '我的任务': b.taskRecords,
          '积分': [],
          '我的勋章': b.medalRecords,
          '我的活动': b.activityRecords
        };
        if (activeSubFilter === '积分') {
          // 积分不显示在时间线中，跳过
        } else if (subMap[activeSubFilter]) {
          allTraces = subMap[activeSubFilter];
        }
      }

      // 按时间排序（倒序）
      allTraces.sort((a, b) => new Date(b.date || b.createdAt) - new Date(a.date || a.createdAt));

      const container = document.getElementById('timelineContent');
      if (allTraces.length === 0) {
        container.innerHTML = '<p class="text-muted" style="padding:20px;">该类别暂无记录</p>';
        return;
      }

      container.innerHTML = allTraces.map(t => {
        const typeClass = getTraceTypeClass(t.type);
        const statusHtml = t.status ? `<span class="pt-status ${t.status === '已完成' ? 'done' : 'pending'}">${t.status}</span>` : '';
        const amountHtml = t.amount ? `<span style="color:#c41e3a;font-weight:600;">¥${t.amount}</span>` : '';

        return `
          <div class="pt-item">
            <div class="pt-dot"></div>
            <div class="pt-time">${t.date || App.formatDate(t.createdAt)} ${t.createdAt ? new Date(t.createdAt).toTimeString().substring(0, 5) : ''}</div>
            <div class="pt-content">
              <span class="pt-type ${typeClass}">${t.type}</span>
              <div class="pt-title">${t.title} ${amountHtml}</div>
              <div class="pt-desc">${t.content}</div>
              ${statusHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    // 获取轨迹类型样式类
    function getTraceTypeClass(type) {
      const map = {
        '党员发展': 'event',
        '学习历程': 'study',
        '三会一课': 'meeting',
        '志愿者': 'volunteer',
        '我的帮扶': 'volunteer',
        '我的任务': 'task',
        '我的勋章': 'medal',
        '我的活动': 'event',
        '党费缴纳': 'payment'
      };
      return map[type] || 'event';
    }
  </script>
